# Render Blueprint — one web service + one free Postgres, wired together.
# Deploy: push this to GitHub, then on Render: New > Blueprint, pick the repo.
services:
  - type: web
    name: night-at-the-races
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn "app:create_app()" --workers 1 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: natr-db
          property: connectionString
      - key: GUEST_SESSION_SECRET
        generateValue: true          # random, kept secret by Render
      - key: BANKER_PASSWORD
        sync: false                  # set this yourself in the dashboard
      - key: ZEFFY_API_KEY
        sync: false                  # optional; only needed for live Zeffy pulls
      - key: PYTHON_VERSION
        value: "3.12.6"

databases:
  - name: natr-db
    plan: free
