<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night at the Races — Betting</title>
<style>
  :root{--green:#123c2b;--green-2:#0d2c20;--brass:#c7963b;--brass-2:#a97c28;--paper:#f3ede0;
    --paper-2:#e7dec9;--ink:#1b1a16;--muted:#6f6857;--win:#2f7d4f;--lose:#a5342b;--line:#d8cdb4;--live:#1d6b46;--tap:60px}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.tote{background:linear-gradient(var(--green),var(--green-2));color:var(--paper);padding:16px 20px 18px;border-bottom:3px solid var(--brass);position:sticky;top:0;z-index:5}
  .tote .title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0}
  .tote .name{font-size:14px;color:#e9e3d3;margin:2px 0 10px;min-height:16px}
  .balance{display:flex;align-items:baseline;gap:10px}
  .balance .amt{font-size:46px;line-height:1;font-weight:700} .balance .lbl{font-size:13px;color:#cfc7b2}
  .chips-hint{font-size:12.5px;color:#cfc7b2;margin-top:6px} .conn{float:right;font-size:12px;color:#cfc7b2} .conn.bad{color:#f0c36b}
  main{flex:1;padding:18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  input[type=text]{width:100%;font-size:20px;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:12px}
  input:focus{outline:3px solid var(--brass);border-color:var(--brass)}
  .seg{display:flex;gap:8px;margin-bottom:16px}
  .seg button{flex:1;padding:12px;font-size:15px;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--green);color:var(--paper);border-color:var(--green)}
  .btn{width:100%;min-height:var(--tap);border:none;border-radius:14px;background:var(--brass);color:#231c07;font-size:19px;font-weight:700}
  .btn:disabled{background:var(--paper-2);color:var(--muted)} .btn.secondary{background:transparent;border:2px solid var(--line);color:var(--muted);font-weight:600;min-height:50px}
  .msg{padding:12px 14px;border-radius:10px;font-size:15px;margin-bottom:14px;display:none} .msg.show{display:block}
  .msg.ok{background:#e4f0e7;color:var(--win)} .msg.err{background:#f6e4e2;color:var(--lose)}
  .race{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#fff}
  .race.dim{opacity:.6}
  .rhead{display:flex;align-items:center;gap:12px}
  .rnum{flex:none;min-width:50px;height:50px;padding:0 8px;border-radius:12px;background:var(--brass);color:#231c07;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:inset 0 0 0 2px var(--brass-2)}
  .rnum.done{background:var(--green);color:var(--paper);box-shadow:inset 0 0 0 2px var(--brass)}
  .rnum .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:2px} .rnum .n{font-size:24px}
  .rname{font-size:17px;font-weight:600} .pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
  .pill.live{background:#dff0e5;color:var(--live)} .pill.upcoming{background:#efe7d3;color:var(--muted)} .pill.closed{background:#f2e6d3;color:var(--brass-2)} .pill.settled{background:#e6e0d0;color:var(--ink)}
  .countdown{font-size:14px;font-weight:700;color:var(--live);margin:10px 0 4px} .countdown.warn{color:var(--lose)}
  .horse{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;width:100%;font-size:17px;margin-top:8px}
  .horse .no{width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .horse[aria-pressed=true]{border-color:var(--brass);background:#fbf4e4;box-shadow:0 0 0 2px var(--brass) inset}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
  .stepper button{width:52px;height:52px;border-radius:12px;border:2px solid var(--green);background:#fff;color:var(--green);font-size:26px} .stepper button:disabled{opacity:.35}
  .stepper .val{font-size:18px;font-weight:700}
  .mystakes{background:#fbf4e4;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:12px 0 0;font-size:13.5px;line-height:1.7}
  .mystakes .lbl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-2);margin-bottom:3px}
  .mystakes .b{display:inline-block;margin-right:12px;white-space:nowrap}
  .reveal{border-radius:12px;padding:12px;font-size:15px;margin-top:10px}
  .reveal.win{background:#dff0e5;color:var(--win);border:1px solid #b6dcc4} .reveal.lose{background:#f2e9e2;color:var(--muted);border:1px solid var(--line)}
  .toast{position:sticky;top:0;z-index:9;margin:0 0 14px;border-radius:12px;padding:14px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px}
  .toast.win{background:#dff0e5;color:var(--win)} .toast.lose{background:#efe7d3;color:var(--ink)} .toast button{margin-left:auto;background:transparent;border:none;font-size:20px;color:inherit}
  .empty{color:var(--muted);text-align:center;padding:24px 10px} .foot{padding:16px 20px;color:var(--muted);font-size:12px;text-align:center}
  @media (prefers-reduced-motion:no-preference){.flash{animation:flash .5s ease}@keyframes flash{0%{background:#fbf4e4}100%{background:var(--paper)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="tote">
    <span class="conn" id="conn"></span>
    <p class="title">Night at the Races</p>
    <p class="name" id="who"></p>
    <div class="balance"><span class="amt num" id="bal">—</span><span class="lbl">in chips</span></div>
    <div class="chips-hint" id="chipsHint"></div>
  </header>
  <main>
    <section class="card" id="claimCard">
      <h2>Check in to bet</h2>
      <div class="seg" role="tablist">
        <button id="tabCode" aria-pressed="true" onclick="setMode('code')">Claim code</button>
        <button id="tabEmail" aria-pressed="false" onclick="setMode('email')">Email</button>
      </div>
      <input id="claimInput" type="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="Enter your claim code">
      <div class="msg err" id="claimMsg"></div>
      <button class="btn" id="claimBtn" onclick="doClaim()">Check in</button>
    </section>
    <section id="betArea" hidden>
      <div id="toasts"></div>
      <div class="msg" id="betMsg"></div>
      <div id="cardList"></div>
      <button class="btn secondary" onclick="signOut()">Sign out</button>
    </section>
  </main>
  <div class="foot">Winnings land back in your chips automatically. Cash out any time at the bank.</div>
</div>
<script>
const $=s=>document.querySelector(s);
const money=c=>'$'+((c||0)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
let token=localStorage.getItem('natr_token')||null;
let mode='code', last=null, clockOffset=0, pollTimer=null, tickTimer=null;
let pick={}, chips={}, busy={}, acked={};
const srvNow=()=>Math.floor(Date.now()/1000)+clockOffset;

function setMode(m){ mode=m; $('#tabCode').setAttribute('aria-pressed',m==='code'); $('#tabEmail').setAttribute('aria-pressed',m==='email');
  const i=$('#claimInput'); i.placeholder=m==='code'?'Enter your claim code':'Enter your email'; i.value=''; i.setAttribute('autocapitalize',m==='code'?'characters':'none'); }
async function api(path,body){ const o={method:body?'POST':'GET',headers:{}}; if(token)o.headers['Authorization']='Bearer '+token;
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);} const r=await fetch(path,o); return r.json(); }

async function doClaim(){ const v=$('#claimInput').value.trim(); if(!v){return claimErr('Enter your '+(mode==='code'?'claim code':'email')+'.');}
  $('#claimBtn').disabled=true; $('#claimBtn').textContent='Checking…';
  try{ const r=await api('/api/claim', mode==='code'?{code:v}:{email:v});
    if(!r.ok) claimErr(r.reason||'Could not check you in.'); else { token=r.token; localStorage.setItem('natr_token',token); enter(); } }
  catch(e){ claimErr('Network hiccup — try again.'); }
  $('#claimBtn').disabled=false; $('#claimBtn').textContent='Check in'; }
function claimErr(m){ const e=$('#claimMsg'); e.textContent=m; e.classList.add('show'); }

function enter(){ $('#claimCard').hidden=true; $('#betArea').hidden=false; refresh(); startTimers(); }
function signOut(){ token=null; localStorage.removeItem('natr_token'); stopTimers(); $('#betArea').hidden=true; $('#claimCard').hidden=false; $('#claimMsg').classList.remove('show'); $('#bal').textContent='—'; $('#who').textContent=''; last=null; pick={};chips={};acked={}; }

function setConn(ok){ const e=$('#conn'); if(ok){e.textContent='';e.classList.remove('bad');} else {e.textContent='reconnecting…';e.classList.add('bad');} }
async function refresh(){ try{ const s=await api('/api/state'); setConn(true); if(!s.ok){ signOut(); return; }
    clockOffset = s.server_now - Math.floor(Date.now()/1000); last=s; render(); }catch(e){ setConn(false); } }

function maxChips(){ return last?Math.floor(last.balance_cents/1000):0; }
function render(){
  if(!last) return;
  $('#bal').textContent=money(last.balance_cents); $('#chipsHint').textContent=maxChips()+' chips available';
  const toasts=$('#toasts'); let tHtml='';
  (last.races||[]).forEach(r=>{ if(r.status==='settled' && r.result && !acked[r.race_id]){ const w=r.result.won;
    tHtml+='<div class="toast '+(w?'win':'lose')+'">'+(w?'🏆':'🎲')+' <div><b>Race '+r.ordinal+'</b> — #'+r.result.winning_horse+' wins. '+(w?('You won '+money(r.result.payout_cents)+'!'):'Not your race this time.')+'</div><button onclick="ack(\''+r.race_id+'\')">✕</button></div>'; } });
  toasts.innerHTML=tHtml;

  const box=$('#cardList');
  if(!last.races || !last.races.length){ box.innerHTML='<div class="card empty">No races yet — sit tight, betting opens soon.</div>'; return; }
  box.innerHTML='';
  last.races.forEach(r=>{
    const el=document.createElement('div'); el.className='race'+((r.status==='upcoming'||r.status==='closed')?' dim':'');
    const nm=r.name||('Race '+r.ordinal);
    let head='<div class="rhead"><div class="rnum '+(r.status==='settled'?'done':'')+'"><span class="k">Race</span><span class="n num">'+r.ordinal+'</span></div>'
      +'<div style="flex:1;min-width:0"><div class="rname">'+nm+'</div></div><span class="pill '+r.status+'">'+r.status+'</span></div>';
    let body='';
    if(r.status==='live'){
      const cls=(r.closes_at!=null && (r.closes_at-srvNow())<=30)?'warn':'';
      body+='<div class="countdown '+cls+'">'+(r.closes_at!=null?('⏱ '+cd(r)+' to bet'):'Betting open')+'</div>';
      (r.horses||[]).forEach(h=>{ const sel=String(h.number)===pick[r.race_id];
        body+='<button class="horse" aria-pressed="'+sel+'" onclick="pickHorse(\''+r.race_id+'\',\''+h.number+'\')"><span class="no num">'+h.number+'</span><span>'+(h.name||('Horse '+h.number))+'</span></button>'; });
      const n=chips[r.race_id]||1, canUp=n<maxChips();
      body+='<div class="stepper"><button onclick="bump(\''+r.race_id+'\',-1)" '+(n<=1?'disabled':'')+'>–</button><div class="val num">'+n+' chip · '+money(n*1000)+'</div><button onclick="bump(\''+r.race_id+'\',1)" '+(canUp?'':'disabled')+'>+</button></div>';
      const ready=!!pick[r.race_id] && maxChips()>=n && !busy[r.race_id];
      const label = maxChips()<1 ? 'No chips — see the bank' : (pick[r.race_id]?('Place '+money(n*1000)+' on '+pick[r.race_id]):'Tap a horse first');
      body+='<button class="btn" '+(ready?'':'disabled')+' onclick="placeBet(\''+r.race_id+'\')">'+(busy[r.race_id]?'Placing…':label)+'</button>';
    } else if(r.status==='upcoming'){ body+='<div class="countdown" style="color:var(--muted)">Opens soon</div>';
    } else if(r.status==='closed'){ body+='<div class="countdown" style="color:var(--lose)">Betting closed — results coming</div>';
    } else if(r.status==='settled'){ const won=r.result&&r.result.won;
      body+='<div class="reveal '+(won?'win':'lose')+'">#'+r.winning_horse+' wins.'+((r.your_stake&&r.your_stake.length)?(won?(' You won '+money(r.result.payout_cents)+'.'):' Not your race this time.'):'')+'</div>'; }
    body+=stakes(r);
    el.innerHTML=head+body; box.appendChild(el);
  });
}
function cd(r){ const s=Math.max(0,(r.closes_at||0)-srvNow()); const m=Math.floor(s/60); return (m>0?m+'m ':'')+(s%60)+'s'; }
function stakes(r){ const l=r.your_stake||[]; if(!l.length) return '';
  const label = r.status==='settled'?'You had':(r.status==='closed'?'Riding on this race':'Your bets this race');
  const tot=l.reduce((s,x)=>s+x.cents,0);
  return '<div class="mystakes"><span class="lbl">'+label+' · '+money(tot)+' total</span>'+l.map(x=>'<span class="b">'+money(x.cents)+' on <b>'+(x.name||('#'+x.horse))+'</b></span>').join('')+'</div>'; }

function pickHorse(rid,no){ pick[rid]=String(no); render(); }
function bump(rid,d){ const n=Math.max(1,Math.min(maxChips()||1,(chips[rid]||1)+d)); chips[rid]=n; render(); }
function ack(rid){ acked[rid]=true; render(); }
async function placeBet(rid){ if(busy[rid]||!pick[rid]) return; busy[rid]=true; render();
  const n=chips[rid]||1; const attempt=()=>api('/api/bet',{race_id:rid,horse:pick[rid],chips:n});
  try{ let res; try{res=await attempt();}catch(_){res=await attempt();}
    if(res.ok){ betMsg('Bet placed — '+money(n*1000)+' on '+pick[rid]+'.',true); pick[rid]=null; chips[rid]=1; }
    else betMsg(reason(res.reason),false); }
  catch(e){ betMsg("Couldn't reach the server — your chips are safe, try again.",false); }
  busy[rid]=false; await refresh(); }
function reason(r){ return ({'insufficient balance':'Not enough chips — see the bank to add more.','past post time':"Too late — betting's closed for this race.",
  'race not open':'Betting is closed for this race.','no such race':'That race just closed — pick the next one.'})[r]||(r||'That bet didn’t go through.'); }
function betMsg(m,ok){ const e=$('#betMsg'); e.textContent=m; e.className='msg show '+(ok?'ok':'err'); setTimeout(()=>e.classList.remove('show'),3500); }

function startTimers(){ stopTimers(); pollTimer=setInterval(refresh,3000); tickTimer=setInterval(()=>{ if(last)render(); },1000); }
function stopTimers(){ if(pollTimer)clearInterval(pollTimer); if(tickTimer)clearInterval(tickTimer); pollTimer=tickTimer=null; }

if(token) enter(); else setMode('code');
</script>
</body>
</html>
